<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #12080f; color: #fde7c4; font-family: system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; }
  h1 { margin: 0; font-size: clamp(24px, 3.4vw, 36px); color: #fbbf24; }
  #goldBox { font: 800 20px ui-monospace, monospace; color: #fde047; }
  nav { display: flex; flex-wrap: wrap; gap: 10px; }
  nav a { color: #1c1917; background: #f59e0b; font-weight: 800; font-size: 18px; text-decoration: none; padding: 8px 16px; border-radius: 8px; }
  nav a.alt { background: #6b1d3a; color: #fde7c4; }
  .wrap { flex: 1; display: grid; place-items: center; padding: 0 12px 16px; }
  .scroller { width: 100%; overflow-x: auto; display: grid; place-items: center; }
  .scene { position: relative; container-type: inline-size; width: min(2560px, 100%, calc((100vh - 120px) * 2)); aspect-ratio: 2 / 1; background: #1b0b16 url(media/cas_bg.webp) 0 0 / 100% 100% no-repeat; border-radius: 10px; box-shadow: 0 0 0 3px #b45309, 0 0 30px rgba(192,38,211,.35), 0 20px 60px rgba(0,0,0,.7); overflow: hidden; }
  @media (max-width: 700px) { .scene { min-width: 700px; } .scroller { place-items: start; } }

  /* ---- Ada's animation layers (positions come from her layout.json, 2560 x 1280) ---- */
  .fx { position: absolute; pointer-events: none; background-repeat: no-repeat; }
  .strip { animation-name: stripRun; animation-iteration-count: infinite; }
  @keyframes stripRun { to { background-position: 100% 0; } }
  #smoke { left: -7%; top: 0; width: 113.3%; height: 100%; background: url(media/cas_smoke.webp) 0 0 / 100% 100%; opacity: .6; z-index: 6; animation: smokeDrift 50s ease-in-out infinite alternate; }
  @keyframes smokeDrift { from { transform: translateX(-3.5%); } to { transform: translateX(3.5%); } }
  .palm { width: 1.875%; aspect-ratio: 1; background: url(media/cas_warm_glow.webp) 0 0 / 100% 100%; mix-blend-mode: screen; animation: palmGlow 3.4s ease-in-out infinite alternate; }
  @keyframes palmGlow { from { opacity: .12; } to { opacity: .45; } }
  .vapor { width: 2.73%; height: 7.8%; background: url(media/cas_green_vapor.webp) 0 0 / 100% 100%; opacity: 0; animation: vaporUp 4.5s linear infinite; }
  @keyframes vaporUp { 0% { opacity: 0; transform: translate(0, 0); } 30% { transform: translate(.3cqw, -14%); } 50% { opacity: .3; } 70% { transform: translate(-.3cqw, -32%); } 100% { opacity: 0; transform: translate(0, -45%); } }
  #ball { width: .625%; aspect-ratio: 1; background: url(media/cas_ball.webp) 0 0 / 100% 100%; z-index: 2; }
  #eye { left: 90.47%; top: 16.64%; width: 1.33%; height: 2.03%; background: url(media/cas_eye_glance.webp) 0 0 / 100% 100%; opacity: 0; z-index: 2; }
  #cigarGlow { left: 85.31%; top: 17.34%; width: 2.81%; aspect-ratio: 1; background: url(media/cas_warm_glow.webp) 0 0 / 100% 100%; mix-blend-mode: screen; opacity: 0; z-index: 2; }
  .portraitEvent #eye { animation: eyeLook 2.5s ease-in-out; } .portraitEvent #cigarGlow { animation: cigarPuff 2.5s ease-in-out; }
  @keyframes eyeLook { 0%, 100% { opacity: 0; } 30%, 70% { opacity: 1; } }
  @keyframes cigarPuff { 0%, 100% { opacity: 0; } 50% { opacity: .65; } }
  .still .fx, .still .strip, .still #host { animation-play-state: paused !important; }

  /* ---- things you can click ---- */
  .hs { position: absolute; z-index: 3; padding: 0; border: 3px solid transparent; border-radius: 12px; background: transparent; cursor: pointer; }
  .hs:hover, .hs:focus-visible { border-color: #fcd34d; box-shadow: 0 0 16px #fcd34d, inset 0 0 12px rgba(252,211,77,.25); outline: none; }
  .hs.person { z-index: 4; }

  /* ---- the host: Ada's goblin in the fez ---- */
  #host { position: absolute; z-index: 5; padding: 0; border: 0; background-color: transparent; cursor: pointer; background-repeat: no-repeat; background-position: 0 0; translate: -50% 0; transition: left 0s linear; filter: drop-shadow(0 .35cqw .3cqw rgba(0,0,0,.55)); }
  #host:hover, #host:focus-visible { filter: drop-shadow(0 0 .6cqw #fcd34d); outline: none; }
  #host.flip { transform: scaleX(-1); }

  /* ---- talk ---- */
  #note { position: absolute; z-index: 9; max-width: 40%; padding: .7cqw 1cqw; border-radius: 1cqw; background: rgba(28,8,22,.93); border: .2cqw solid #f59e0b; box-shadow: 0 0 1.2cqw rgba(192,38,211,.45); color: #fde7c4; font: 800 clamp(16px, 1.25cqw, 26px)/1.35 system-ui, sans-serif; text-align: center; display: none; pointer-events: none; }
  #talk { position: absolute; left: 50%; top: 1.5%; translate: -50% 0; z-index: 9; display: none; align-items: center; gap: 1cqw; width: min(64%, 1100px); padding: .8cqw 1.2cqw; border-radius: 1.2cqw; background: rgba(28,8,22,.95); border: .25cqw solid #f59e0b; box-shadow: 0 0 1.4cqw rgba(192,38,211,.5); pointer-events: none; }
  #talk img { width: 7cqw; height: auto; flex: none; filter: drop-shadow(0 .2cqw .2cqw rgba(0,0,0,.6)); }
  #talk b { display: block; color: #fbbf24; font-size: clamp(15px, 1.15cqw, 24px); }
  #talk span { display: block; color: #fde7c4; font: 800 clamp(17px, 1.4cqw, 28px)/1.35 system-ui, sans-serif; }

  /* ---- popups ---- */
  .dlg { position: fixed; inset: 0; z-index: 70; display: none; align-items: center; justify-content: center; background: rgba(8,2,8,.72); padding: 12px; }
  .dlg.open { display: flex; }
  .box { width: min(620px, 100%); max-height: 94vh; overflow: auto; background: #1f0a18; border: 4px solid #d97706; border-radius: 16px; padding: 18px; color: #fde7c4; box-shadow: 0 0 40px rgba(192,38,211,.35), 0 20px 60px rgba(0,0,0,.6); }
  .box h2 { margin: 0 0 6px; font-size: 28px; color: #fbbf24; } .box p { font-size: 18px; line-height: 1.45; margin: 6px 0; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
  .big { font: 800 19px system-ui, sans-serif; padding: 10px 18px; border-radius: 10px; border: 0; cursor: pointer; background: #f59e0b; color: #1c1917; }
  .big.alt { background: #6b1d3a; color: #fde7c4; } .big:disabled { background: #57534e; color: #d6d3d1; cursor: default; }
  .buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); max-width: 520px; margin-inline: auto; gap: 14px; margin-top: 12px; }
  .bucket { background: #2b0f22; border: 2px solid #7c2d12; border-radius: 12px; padding: 12px; text-align: center; }
  .bucket img { width: 100%; max-width: 220px; height: auto; display: block; margin: 0 auto 6px; }
  .bucket b { font-size: 20px; color: #fbbf24; display: block; } .bucket small { font-size: 16px; color: #e7d3b8; }
  .bucket.locked img { filter: grayscale(.85) brightness(.55); }
  #exMsg { min-height: 1.4em; margin-top: 10px; text-align: center; font-weight: 800; font-size: 18px; color: #fde68a; }

  /* ---- the slot machine close-up (Ada's cabinet + buttons). The reels are not in yet ---- */
  #slot .stage { position: relative; width: min(560px, 92vw, calc(88vh * 997 / 1370)); aspect-ratio: 997 / 1370; container-type: inline-size; }
  #slot .cab { position: absolute; inset: 0; width: 100%; height: 100%; }
  #screen { position: absolute; left: 15.65%; top: 29.27%; width: 62.7%; height: 26.1%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2cqw; padding: 3cqw; text-align: center; color: #fde68a; background: radial-gradient(ellipse at 50% 40%, rgba(147,51,234,.35), transparent 70%); }
  #screen .t1 { font: 900 7cqw/1 Impact, 'Arial Black', system-ui, sans-serif; letter-spacing: .05em; color: #fcd34d; text-shadow: 0 .4cqw 0 #7c2d12, 0 0 2cqw rgba(250,204,21,.55); }
  #screen .t2 { font: 800 3.6cqw/1.25 system-ui, sans-serif; color: #f5d0fe; }
  #screen .t3 { font: 800 3.4cqw/1.3 system-ui, sans-serif; color: #fde7c4; min-height: 2.6em; }
  #screen.broken { background: none; }
  .sbtn { position: absolute; padding: 0; border: 0; background: none; cursor: pointer; translate: -50% -50%; }
  .sbtn img { display: block; width: 100%; height: auto; pointer-events: none; }
  .sbtn:focus-visible { outline: .5cqw solid #fde68a; border-radius: 1cqw; }
  #cup { position: absolute; left: 85.8%; bottom: 28.1%; padding: 0; border: 0; background: none; cursor: pointer; display: none; }
  #cup img { display: block; width: 100%; height: auto; }
  #gregRam { position: absolute; left: 84.45%; top: 50.36%; width: 20.06%; height: 16.79%; background: url(media/cas_gregram.webp) 0 0 / 1000% 100% no-repeat; display: none; pointer-events: none; }
  #slotClose { position: absolute; right: -6px; top: -6px; z-index: 3; }
</style></head><body>

<script>
const $ = (id) => document.getElementById(id);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const get = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const fmt = (n) => { n = Math.round(n); if (n < 1e15) return n.toLocaleString() + 'g'; const e = Math.floor(Math.log10(n)); return (n / Math.pow(10, e)).toFixed(2) + 'e' + e + 'g'; };
const gold = () => Math.max(0, Number(get('painWheelGold', 0)) || 0);
const tokens = () => Math.max(0, Number(get('painWheelTokens', 0)) || 0);
const showGold = () => { if (window.renderGoldBox) renderGoldBox(); else $('goldBox').textContent = '🪙 ' + fmt(gold()); };
showGold(); addEventListener('storage', (e) => { if (e.key === 'painWheelGold') showGold(); });
put('painWheelSeenCasino', true);
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (still) $('scene').classList.add('still');

// sound: the wheel's own clips, at the wheel's volume
let AC = null; const BUF = {};
const vol = () => { const v = parseFloat(localStorage.getItem('painWheelVolume')); return isNaN(v) ? 0.6 : Math.max(0, Math.min(1, v)); };
const sfx = (name, g) => { try { if (!vol()) return; AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  const go = (b) => { const s = AC.createBufferSource(), gn = AC.createGain(); s.buffer = b; gn.gain.value = (g || .8) * vol(); s.connect(gn); gn.connect(AC.destination); s.start(); };
  if (BUF[name]) return go(BUF[name]); fetch('media/' + name + '.mp3').then(r => r.arrayBuffer()).then(ab => AC.decodeAudioData(ab)).then(b => { BUF[name] = b; go(b); }).catch(() => {}); } catch (e) {} };
const blip = (f, ms, type) => { try { if (!vol()) return; AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'square'; o.frequency.value = f; g.gain.setValueAtTime(.06 * vol(), AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + ms / 1000); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + ms / 1000); } catch (e) {} };
addEventListener('pointerdown', () => { if (AC && AC.state === 'suspended') AC.resume(); }, { once: true });

// ---------- Ada's animation layers ----------
const P = (x) => (x / 25.6) + '%', Q = (y) => (y / 12.8) + '%';
const SCREENS = [[1, 132, 468, 134, 114, 12, 0], [2, 331, 483, 97, 98, 12, 3], [3, 475, 488, 75, 90, 12, 6], [4, 2062, 494, 83, 86, 12, 9], [5, 2198, 486, 95, 95, 1, 0], [6, 2350, 476, 116, 105, 12, 3]];
$('screens').innerHTML = SCREENS.map(([id, x, y, w, h, n, ph]) => `<div class="fx${n > 1 ? ' strip' : ''}" style="left:${P(x)};top:${Q(y)};width:${P(w)};height:${Q(h)};background-image:url(media/cas_scr${id}.webp);background-size:${n * 100}% 100%;z-index:1${n > 1 ? `;animation-duration:2.64s;animation-timing-function:steps(${n},jump-none);animation-delay:-${(ph * .22).toFixed(2)}s` : ''}"></div>`).join('');
const PALMS = [[766, 394], [725, 457], [756, 506], [1795, 392], [1828, 454], [1798, 506]];
const VAPOR = [[80, 345], [299, 383], [466, 407], [2052, 437], [2250, 410], [2470, 371]];
$('glows').innerHTML = PALMS.map(([x, y], i) => `<div class="fx palm" style="left:${P(x - 24)};top:${Q(y - 24)};z-index:2;animation-delay:-${(i * 1.1).toFixed(1)}s"></div>`).join('')
  + VAPOR.map(([x, y], i) => `<div class="fx vapor" style="left:${P(x - 35)};top:${Q(y - 80)};z-index:2;animation-delay:-${(i * .945).toFixed(2)}s"></div>`).join('');
// the roulette ball rolls around the wheel (an ellipse: center 1046,716, radii 112 x 25)
(function roll(t) { if (!still && !document.hidden) { const a = t / 900, b = $('ball'); b.style.left = P(1046 + Math.cos(a) * 112 - 8); b.style.top = Q(716 + Math.sin(a) * 25 - 8); } requestAnimationFrame(roll); })(0);
// the portrait: once in a while the owner looks at you and puffs his cigar
function portraitEvent() { const s = $('scene'); s.classList.remove('portraitEvent'); void s.offsetWidth; s.classList.add('portraitEvent'); setTimeout(() => s.classList.remove('portraitEvent'), 2600); }
if (!still) (function later() { setTimeout(() => { if (!document.hidden && Math.random() < .5) portraitEvent(); later(); }, 40000 + Math.random() * 60000); })();

// ---------- talk ----------
const lastPt = { t: 0 };
addEventListener('pointerdown', (e) => { const r = $('scene').getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return;
  lastPt.x = (e.clientX - r.left) / r.width * 100; lastPt.y = (e.clientY - r.top) / r.height * 100; lastPt.t = Date.now(); }, true);
function note(t, ms) {   // a box next to whatever you clicked
  const d = $('note'); d.textContent = t; d.style.display = 'block';
  if (Date.now() - lastPt.t > 6000) { d.style.left = '50%'; d.style.top = '4%'; d.style.transform = 'translateX(-50%)'; }
  else { const below = lastPt.y < 30; d.style.left = Math.max(21, Math.min(79, lastPt.x)) + '%'; d.style.top = (below ? lastPt.y + 5 : lastPt.y - 4) + '%'; d.style.transform = below ? 'translateX(-50%)' : 'translate(-50%, -100%)'; }
  clearTimeout(note.t); note.t = setTimeout(() => d.style.display = 'none', ms || 4200);
}
const HOST_NAME = 'The Pit Boss';   // Aaron: name him and this updates everywhere
function hostSay(text, face, ms) {   // the host talks in a box at the bottom with his face in it
  $('talkFace').src = 'media/cas_hh_' + (face || 'smirk') + '.webp'; $('talkName').textContent = HOST_NAME; $('talkText').textContent = text;
  $('talk').style.display = 'flex'; clearTimeout(hostSay.t); hostSay.t = setTimeout(() => $('talk').style.display = 'none', ms || 5200);
}

// ---------- the pit boss: stands on the carpet watching the floor, now and then walks a drink over to the craps table ----------
const K = 9.6 / 229;   // cqw per sprite pixel (he is about 19% of the room tall)
const POSE = { idle: { w: 194, h: 229, f: 'stand' },   // no idle loop: the other people in the room hold still too
  walk: { w: 217, h: 219, n: 4, ms: 620 }, tray: { w: 219, h: 217 }, offer: { w: 246, h: 218 },
  bow: { w: 249, h: 218 }, strut: { w: 220, h: 241 }, laugh: { w: 246, h: 250 }, wipe: { w: 159, h: 244 }, shrug: { w: 216, h: 243 }, lean: { w: 256, h: 259 } };
const host = $('host'); let hostX = 57, busy = false;
function pose(p) {
  const s = POSE[p]; host.style.width = (s.w * K) + 'cqw'; host.style.height = (s.h * K) + 'cqw';
  host.style.backgroundImage = `url(media/cas_host_${s.f || p}.webp)`;
  if (s.n) { host.style.backgroundSize = (s.n * 100) + '% 100%'; host.style.animation = still ? 'none' : `stripRun ${s.ms}ms steps(${s.n},jump-none) infinite`; }
  else { host.style.backgroundSize = '100% 100%'; host.style.animation = 'none'; host.style.backgroundPosition = '0 0'; }
}
function place(x) { hostX = x; host.style.left = x + '%'; host.style.bottom = '4.5%'; }
pose('idle'); place(hostX);
function walkTo(x, done) {
  if (still) { place(x); done && done(); return; }
  const dist = Math.abs(x - hostX), ms = dist * 330;
  host.classList.toggle('flip', x < hostX); pose('walk');   // the walk art faces right
  host.style.transition = `left ${ms}ms linear`; requestAnimationFrame(() => place(x));
  setTimeout(() => { host.style.transition = 'left 0s'; host.classList.remove('flip'); done && done(); }, ms + 30);
}
const RUN = ["Craps table! Fresh drink. On the house. The house is charging you later.", "Who ordered the Coconut Calamity? Nobody? It is yours now.", "Drink for the dealer. She earned it. She has not, but she will."];
function drinkRun() {
  if (busy || document.hidden || $('slot').classList.contains('open') || $('cage').classList.contains('open')) return; busy = true;
  pose('tray'); setTimeout(() => walkTo(40, () => { pose('offer'); note('🍹 ' + pick(RUN), 3600);
    setTimeout(() => { pose('bow'); setTimeout(() => walkTo(57, () => { pose('idle'); busy = false; }), 1200); }, 2600); }), 900);
}
if (!still) setInterval(() => { if (Math.random() < .55) drinkRun(); }, 26000);
const HELLO_FIRST = ["Welcome to Chief Kick a Bitch's Casino! Wipe your feet. Not on me.", "A new face! The house loves new faces. New faces have full wallets."];
const HELLO = ["Back again! The slots missed you. The slots say that to everybody.", "Ah, a regular! Your usual table is waiting. It is the one you lose at.", "Welcome back! Keep your hands where the bouncers can see them."];
const HOST = [["The cigar? Decorative. The smoke? Also decorative. The fire? Unfortunately real.", 'smirk'],
  ["We have the best odds in all of Undermine. The odds are that you lose. We are very honest about it.", 'laugh'],
  ["The fourth slot on the right? Do not ask about the fourth slot on the right.", 'grump'],
  ["Gold goes in, tokens come out, tokens go in, tokens stay in. That is the whole business model.", 'smirk'],
  ["I have worked here forty years. I have been tipped twice. Both times it was a button.", 'grump'],
  ["The towel is for the bar. Not for crying. We have a separate towel for crying. It is soaked.", 'smirk'],
  ["Is that Cogsworth? Tell him the reels are installed when they are installed.", 'shock'],
  ["Vermont called. We did not pick up. We never pick up for Vermont.", 'laugh'],
  ["Free drinks while you play! Free means the price is in your losses.", 'smirk'],
  ["I was asleep. I mean, I was watching the floor with my eyes closed. Very professional.", 'sleep'],
  ["I am the pit boss. I watch the tables, I watch the slots, I watch you. Mostly I watch you.", 'grump'],
  ["Cindy does the drinks. I help Cindy with the drinks. Cindy says I do not help. Cindy is wrong.", 'shrug'],
  ["Counting cards? In MY casino? Go ahead. We use a deck of forty-nine. Good luck.", 'laugh'],
  ["Everybody happy? You look happy. Stop that. Happy people stop playing.", 'smirk'],
  ["The eye in the sky sees everything. The eye in the sky is the Chief. He has one eye. It is very busy.", 'shock']];
host.onclick = () => {
  if (busy) { hostSay(pick(["Busy! Drinks are getting warm!", "One second, I am working. Do not get used to it."]), 'shock', 2800); return; }
  const [t, f] = pick(HOST), P2 = { laugh: 'laugh', shock: 'shrug', grump: 'wipe', sleep: 'lean', smirk: pick(['shrug', 'wipe', 'lean']) };
  pose(P2[f] || 'shrug'); hostSay(t, f); clearTimeout(host.t); host.t = setTimeout(() => { if (!busy) pose('idle'); }, 3600);
};
setTimeout(() => { const v = get('painWheelCasinoVisits', 0) || 0; put('painWheelCasinoVisits', v + 1); pose('bow'); hostSay(v ? pick(HELLO) : pick(HELLO_FIRST), 'smirk', 5400); setTimeout(() => { if (!busy) pose('idle'); }, 2600); }, 900);

// ---------- the chip exchange ----------
function bucketLevel(n) { return n <= 0 ? 0 : n < 5 ? 1 : n < 15 ? 2 : n < 50 ? 3 : 4; }
function openCage() {
  const n = tokens(), lv = bucketLevel(n);
  $('cageLine').textContent = pick(["The cashier is still counting. The exchange opens soon.", "The cashier bit a coin to check it. It was your coin. Exchange opens soon.", "CLOSED FOR RE-COUNTING. The cashier lost count at seven."]);
  $('bkLoImg').src = 'media/cas_bucket_lo' + lv + '.webp';
  $('bkLoTxt').textContent = n ? `You have ${n} casino token${n === 1 ? '' : 's'}. The bucket has a crack in it. That is not our problem.` : 'Empty. Like your promises. Land on the casino slice for tokens.';
  $('bkHi').hidden = !get('painWheelCasinoHighRoller', false);   // SECRET: the purple bucket only exists once the pit boss gives it to you (every casino achievement)
  $('bkHiTxt').textContent = 'The pit boss gave you this. He has never given anyone anything.';
  $('exMsg').textContent = ''; $('cage').classList.add('open');
}
$('cageClose').onclick = () => $('cage').classList.remove('open');

// ---------- a slot machine, up close: buttons light up and press. The game itself is coming ----------
const SB = [['help', 14.39, 63.3, 8.5], ['betdn', 23.97, 63.3, 8.2], ['betup', 33.55, 63.3, 8.1], ['spin', 47.09, 63.3, 15.3], ['max', 60.38, 63.3, 8.2], ['cash', 70.01, 63.3, 8.4], ['service', 79.49, 63.3, 8.5]];
$('sbtns').innerHTML = SB.map(([n, x, y, w]) => `<button class="sbtn" data-b="${n}" aria-label="${n === 'betdn' ? 'Bet down' : n === 'betup' ? 'Bet up' : n}" style="left:${x}%;top:${y}%;width:${w * 1.04}%"><img src="media/cas_btn_${n}_idle.webp" alt=""></button>`).join('');
['lit', 'down'].forEach(s => SB.forEach(([n]) => { new Image().src = `media/cas_btn_${n}_${s}.webp`; }));
let bet = 1, machine = 1, cupState = null, gregOn = false;
const scr = (t) => { $('scrMsg').textContent = t; };
document.querySelectorAll('.sbtn').forEach(b => {
  const img = b.querySelector('img'), n = b.dataset.b, set = (s) => img.src = `media/cas_btn_${n}_${s}.webp`;
  b.onpointerenter = () => set('lit'); b.onpointerleave = () => set('idle'); b.onfocus = () => set('lit'); b.onblur = () => set('idle');
  b.onpointerdown = () => set('down'); b.onpointerup = () => set(b.matches(':hover') ? 'lit' : 'idle');
  b.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') set('down'); }; b.onkeyup = () => set('lit');
  b.onclick = () => press(n);
});
function press(n) {
  blip(n === 'spin' ? 520 : 880, 70);
  if ($('screen').classList.contains('broken')) { scr(pick(["OUT OF ORDER. GREG BROKE IT.", "Still broken. Pressing harder does not help.", "SERVICE REQUIRED. The service is also broken."])); return; }
  if (n === 'help') scr("Match three slices to win. Reels arrive soon. Ada is painting them.");
  else if (n === 'betup') { bet = Math.min(10, bet + 1); scr(`BET: ${bet} token${bet === 1 ? '' : 's'}. Bold.`); }
  else if (n === 'betdn') { bet = Math.max(1, bet - 1); scr(`BET: ${bet} token${bet === 1 ? '' : 's'}. Coward. (Smart.)`); }
  else if (n === 'max') { bet = 10; scr("MAX BET: 10 tokens. The machine respects you now. It will still take your money."); }
  else if (n === 'cash') scr(pick(["Nothing to cash out. You have not won. Yet.", "CASH OUT? You just sat down."]));
  else if (n === 'spin') scr(pick(["The reels are not installed yet. You spun the vibes.", "SPIN! ...Nothing. The reels are on backorder.", "Coming soon. The goblins are still loading the reels. With their hands."]));
  else if (n === 'service') service();
}
// SERVICE: the host brings you a drink for the cupholder. Once in a while, Greg answers instead
const CUPS = ['soda', 'beer', 'coco', 'slime'];
function setCup(k) { cupState = k; const c = $('cup'); if (!k) { c.style.display = 'none'; return; }
  const img = new Image(); img.onload = () => { c.style.width = (img.naturalWidth * .62 / 997 * 100) + '%'; $('cupImg').src = img.src; c.style.display = 'block'; }; img.src = 'media/cas_cup_' + k + '.webp'; }
function service() {
  if (gregOn) return;
  if (cupState) { scr("You already have a drink. Finish it first. Pace yourself. We need you awake to lose."); return; }
  if (Math.random() < .12) return gregEvent();
  scr("SERVICE light is on. Somebody is coming. Eventually.");
  setTimeout(() => { const k = pick(CUPS); setCup(k); sfx('audio_token', .4);
    scr({ soda: "One soda. It is mostly ice. The ice is mostly soda.", beer: "One beer. Warm. Like a hug from a goblin.", coco: "Coconut Calamity. Do not eat the umbrella.", slime: "Goblin Slime-Lime Slush. It glows. Do not drink it in the dark." }[k]); }, 1400);
}
$('cup').onclick = () => { if (!cupState) return; scr(pick(["Gulp. The cup is empty. Your regrets are full.", "You drank it. You feel lucky. You are not.", "Refreshing! Press SERVICE for another one."])); setCup(null); blip(220, 160, 'triangle'); };
function gregEvent() {   // Ada's ram, Greg, climbs out of the cupholder, steals the drink, and leaves
  gregOn = true; setCup(null); const g = $('gregRam'), MS = [150, 120, 120, 180, 350, 350, 500, 350, 160, 150];
  scr("SPECIAL EVENT: GREG!"); g.style.display = 'block'; let i = 0, t = 0;
  MS.forEach((ms, k) => { setTimeout(() => { g.style.backgroundPosition = `${(k / 9) * 100}% 0`;
    if (k === 4) scr(pick(["Greg: Service? I AM the service.", "Greg: This cupholder is mine now. Rent is due Tuesdays."])); if (k === 7) scr("Greg: *BURP* ...Tip your waiter."); }, t); t += ms * (still ? 1 : 2.2); });
  setTimeout(() => { g.style.display = 'none'; gregOn = false; scr("Greg left. He took the drink. He took the straw. He took your dignity."); }, t + 300);
  const n = (get('painWheelCasinoGreg', 0) || 0) + 1; put('painWheelCasinoGreg', n);
}
function openSlot(m, broken) {
  machine = m; bet = 1; $('screen').classList.toggle('broken', !!broken);
  $('screen').querySelector('.t1').textContent = broken ? 'OUT OF ORDER' : 'THE WHEEL';
  $('screen').querySelector('.t2').textContent = broken ? 'GREG BROKE IT' : 'TRIPLE TROUBLE';
  scr(broken ? 'SERVICE REQUIRED.' : pick(["Insert tokens. Reels coming soon.", "Try your luck! Your luck is on backorder.", "PLAY + WIN (results may vary)"]));

}
$('slotClose').onclick = () => { $('slot').classList.remove('open'); };
document.querySelectorAll('.dlg').forEach(d => d.addEventListener('click', (e) => { if (e.target === d) d.classList.remove('open'); }));
addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.dlg.open').forEach(d => d.classList.remove('open')); });

document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
  const g = b.dataset.go;
  if (g === 'slot') { openSlot(+b.dataset.m, false); return; }
  if (g === 'broken') { openSlot(5, true); return; }
  if (g === 'cage') { openCage(); return; }
  if (g === 'portrait' && Math.random() < .4) portraitEvent();
  note(pick(LINES[g]), 4600);
});
