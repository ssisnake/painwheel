function rotation(now) {
  const c = chicago(now || new Date()); let day = Date.UTC(c.y, c.m - 1, c.d) / 864e5, half;
  if (c.h >= 21) half = 1; else if (c.h >= 9) half = 0; else { day -= 1; half = 1; }
  const secs = c.h * 3600 + c.mi * 60 + c.s, nextAt = c.h < 9 ? 9 * 3600 : c.h < 21 ? 21 * 3600 : 33 * 3600;
  return { id: day * 2 + half, left: (nextAt - secs) * 1000, next: c.h >= 9 && c.h < 21 ? '9 PM' : '9 AM' };
}
function rng(seed) { let a = (seed * 2654435761) >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ---------- prices: a % of your gold by quality (a flea market markup over the vendor price as the floor) ---------- */
const PCT = { poor: .20, common: .22, uncommon: .25, rare: .30, epic: .40, legendary: .50 };   // 20%+ on purpose: one of these can finish a powerful set
const FLOOR = { poor: 500, common: 1000, uncommon: 2500, rare: 6000, epic: 15000, legendary: 50000 };   // 10x what the vendor pays
const QCOL = { poor: '#9d9d9d', common: '#f5f5f4', uncommon: '#1eff00', rare: '#3b9cff', epic: '#b45cf0', legendary: '#ff8000' };
const QDARK = { poor: '#57534e', common: '#44403c', uncommon: '#15803d', rare: '#1d4ed8', epic: '#7e22ce', legendary: '#c2410c' };
const QEMO = { poor: '🧦', common: '📦', uncommon: '🎁', rare: '💎', epic: '🔮', legendary: '👑' };
const priceOf = (q) => Math.max(FLOOR[q], Math.round(gold() * PCT[q]));
const qualityOf = (n) => ['legendary', 'epic', 'rare', 'uncommon', 'common', 'poor'].find(q => LOOT[q].includes(n)) || 'poor';
const setOf = (n) => LOOT_SETS.find(s => !s.soon && s.items.includes(n));
const iconOf = (n) => ITEM_ICON[n] || (n.startsWith('Slurpee') ? 'media/photo_item_slurpee.png' : null);

// six slots, cheap on the left to fancy on the right. The last one is the rare find (1 in 4 is legendary)
const SLOTS = [['poor', 'common'], ['common', 'uncommon'], ['uncommon'], ['uncommon', 'rare'], ['rare', 'epic'], null];
function stockFor(id) {
  const r = rng(id + 7), out = [];
  SLOTS.forEach(qs => {
    const q = qs ? qs[Math.floor(r() * qs.length)] : (r() < .25 ? 'legendary' : 'epic');
    const pool = LOOT[q].filter(n => !out.some(o => o.n === n));
    const w = pool.map(n => (setOf(n) ? 3 : 1) * (iconOf(n) ? 1.5 : 1));   // set pieces and items with art show up more
    let x = r() * w.reduce((a, b) => a + b, 0), n = pool[pool.length - 1];
    for (let i = 0; i < pool.length; i++) { x -= w[i]; if (x <= 0) { n = pool[i]; break; } }
    out.push({ n, q });
  });
  return out;
}

/* ---------- what you own: everything ever found, plus anything bought but not yet unpacked at the wheel ---------- */
const pendingNames = () => (get('painWheelPendingLoot', []) || []).map(l => l[2]).filter(Boolean);
const owned = (n) => !!(get('painWheelFound', {}) || {})[n] || pendingNames().includes(n);
const myBuys = (id) => { const b = get('painWheelEmporium', {}) || {}; return b.rot === id ? (b.slots || []) : []; };

const TAG_X = [15.0, 29.8, 43.3, 57.7, 71.2, 85.2];
let ROT = rotation(), STOCK = stockFor(ROT.id);
function render() {
  const goods = $('goods'), bought = myBuys(ROT.id); goods.innerHTML = '';
  STOCK.forEach((it, i) => {
    const sold = bought.includes(i), ic = iconOf(it.n), b = document.createElement('button');
    b.className = 'item' + (sold ? ' sold' : ''); b.style.left = TAG_X[i] + '%'; b.style.setProperty('--q', QCOL[it.q]);
    b.title = sold ? `${it.n} (sold to you)` : `${it.n} (${it.q})`; b.setAttribute('aria-label', b.title);
    b.innerHTML = ic ? `<img src="${ic}" alt="">` : `<span class="emo">${QEMO[it.q]}</span>`;
    if (!sold && !owned(it.n)) b.insertAdjacentHTML('beforeend', '<span class="new">NEW!</span>');
    b.onclick = () => sold ? say(pick(['That one\'s yours already. I don\'t do doubles. I barely do singles.', 'Sold. To you. Remember? No refunds.'])) : showItem(i);
    goods.appendChild(b);
    const t = document.createElement('div'); t.className = 'tag' + (sold ? ' sold' : ''); t.style.left = (TAG_X[i] + .1) + '%'; t.style.setProperty('--qd', QDARK[it.q]);
    t.innerHTML = sold ? 'SOLD' : `${short(priceOf(it.q))}<small>${it.q}</small>`;
    goods.appendChild(t);
  });
}
function tick() {
  const r = rotation();
  if (r.id !== ROT.id) { ROT = r; STOCK = stockFor(r.id); render(); say('Fresh stock just came off the truck. Don\'t ask which truck.'); sfx('audio_door_chime'); }
  const h = Math.floor(r.left / 36e5), m = Math.floor(r.left % 36e5 / 6e4);
  $('rot').innerHTML = `🕘 New stock in <b>${h ? h + 'h ' : ''}${m}m</b> (${r.next} Central)`;
}

function showItem(i) {
  const it = STOCK[i], ic = iconOf(it.n), st = setOf(it.n), price = priceOf(it.q), card = $('card');
  card.style.setProperty('--q', QCOL[it.q]);
  let setHtml = '';
  if (st) { const have = st.items.filter(owned).length; setHtml = `<div class="set">Part of <b>${st.name}</b>: you have ${have} of ${st.items.length}.${owned(it.n) ? '' : have + 1 === st.items.length ? ' <b>This finishes the set!</b>' : ''}<br><span style="color:#a8a29e">${st.perk}</span></div>`; }
  card.innerHTML = `<div class="pic">${ic ? `<img src="${ic}" alt="">` : `<span>${QEMO[it.q]}</span>`}</div><h2></h2><div class="ql">${it.q}${owned(it.n) ? ' · you have one' : ' · new for you'}</div>
    <p class="desc"></p>${setHtml}<div class="price">${fmt(price)}</div><div class="pct">${Math.round(PCT[it.q] * 1000) / 10}% of your gold (at least ${fmt(FLOOR[it.q])})</div>
    <div class="row"><button class="buy" type="button">🏷️ Buy it</button><button class="no" type="button">Just looking</button></div><div class="msg" role="status"></div>`;
  card.querySelector('h2').textContent = it.n; card.querySelector('.desc').textContent = ITEM_DESC[it.n] ? '"' + ITEM_DESC[it.n] + '"' : 'Axazon swears it is authentic.';
  const buy = card.querySelector('.buy');
  if (gold() < price) { buy.disabled = true; card.querySelector('.msg').textContent = 'You can\'t afford it. Axazon can tell.'; }
  buy.onclick = () => {
    const p = priceOf(it.q), g = gold();
    if (g < p) { card.querySelector('.msg').textContent = 'You can\'t afford it. Axazon can tell.'; return; }
    if (myBuys(ROT.id).includes(i)) return;
    put('painWheelGold', g - p);   // the wheel picks the new total up (and the item, next time it's open)
    const q = get('painWheelPendingLoot', []) || []; q.push([it.q, "🏷️ Bought at Axazon's Emporium", it.n]); put('painWheelPendingLoot', q);
    const b = get('painWheelEmporium', {}) || {}; put('painWheelEmporium', { rot: ROT.id, slots: (b.rot === ROT.id ? b.slots || [] : []).concat(i) });
    const spent = get('painWheelEmporiumSpent', 0) || 0; put('painWheelEmporiumSpent', spent + 1);
    sfx('audio_token'); showGold(); render(); $('dlg').close();
    say(pick(BUY_LINES).replace('{item}', it.n), 5200, 'shield');
  };
  card.querySelector('.no').onclick = () => { $('dlg').close(); if (Math.random() < .5) say(pick(LOOK_LINES)); };
  $('dlg').showModal();
}
$('dlg').addEventListener('click', (e) => { if (e.target === $('dlg')) $('dlg').close(); });

const HELLO = ['Welcome to the Emporium. Everything is authentic. Mostly. Some of it.', 'Look with your eyes. Then buy with your gold.', 'Fresh from the guild bank. Don\'t tell the guild bank.',
  'Every item here fell off a gryphon. Legally.', 'You break it, you bought it. You look at it too long, you also bought it.', 'Back again? Good. Stock turns over at 9 and 9. Central. Like civilized people.'];
const BUY_LINES = ['Pleasure doing business. The {item} is on its way to your bag.', 'SOLD. The {item} will be in your bag next time you\'re at the wheel.', 'Great choice. Terrible price. Great choice.',
  'No refunds. Ever. I want that understood. Enjoy the {item}.', 'Wrapped it in a Discord log for you. Free of charge. This time.'];
const LOOK_LINES = ['Looking is free. For now.', 'That price goes up every time you put it down.', 'Fine. It\'ll be here. Probably. Until 9.'];
const JOKES = {
  refund: ['Read the sign. Read it out loud. Good.', 'I gave a refund once. 2009. Never again.', 'Store credit? This is a tarp. There is no store.'],
  fish: ['That\'s Gary\'s cousin. Steve. Steve is NOT for sale.', 'Don\'t tell Gary I have him. It\'s a whole thing.', 'He sings when the stock turns over. You have to be here at 9 to hear it.'],
  pig: ['The piggy bank is the cash register. Don\'t shake it.', 'Hands off the pig. The pig is the bank. I am the bank.', '*oink* (it is full of copper. you can tell.)'],
  console: ['That\'s a prototype WHEEL-2600. Not for sale. Not even for you.', 'Found it on a yacht. The VIP room. You didn\'t see that.', 'The cartridges are in the back. The back is also a tarp.'],
  jar: ['Don\'t ask what\'s in the jar.', 'That jar has been on that shelf since before the shack. Before the desert.', 'Reb asked about the jar once. Reb doesn\'t ask anymore.']
};
document.querySelectorAll('.hs').forEach(h => h.onclick = () => say(pick(JOKES[h.dataset.hs])));
const AXA_LINES = ['What. I\'m working.', 'Eyes on the merchandise, not the merchant.', 'Yes, the shoulders are looking at you. They do that.', 'This outfit is not for sale. I asked. I said no.',
  'Fishnet breathes. It\'s the desert. Do the math.', 'The halo is real. Don\'t ask how I got it.', 'Browse or buy. Loitering is 5% of your gold.'];
$('axa').onclick = () => say(pick(AXA_LINES));

if (!isOpen()) $('closed').style.display = 'flex';
else { const first = !get('painWheelSeenEmporium', false); put('painWheelSeenEmporium', true); setTimeout(() => say(first ? 'Did you really climb out that window? You special or something?' : pick(HELLO), first ? 6000 : 4800), 700); addEventListener('pointerdown', () => sfx('audio_door_chime', .5), { once: true }); }
addEventListener('storage', (e) => { if (e.key === 'painWheelGold') { showGold(); render(); } if (e.key === 'painWheelEmporium' || e.key === 'painWheelFound') render(); });
render(); tick(); setInterval(tick, 15000);
setInterval(() => { showGold(); }, 5000);
</script>
<script>
// ---- Axazon's stall music: a Turkish/Egyptian bazaar (Pixabay: openmindaudio, soundsbyamelia). A random song each time, never the same one twice in a row ----
(() => {
(() => { if (window.__wfSet) return; window.__wfSet = true; window.__wf = window.__wf;   // our own record of whether this window has focus (more reliable than asking during the blur event)
  addEventListener('blur', () => { window.__wf = false; setTimeout(() => { if (document.activeElement && document.activeElement.tagName === 'IFRAME') window.__wf = true; dispatchEvent(new Event('wfchange')); }, 0); }, true);
  addEventListener('focus', () => { window.__wf = true; dispatchEvent(new Event('wfchange')); }, true);
  addEventListener('pointerdown', () => { if (!window.__wf) { window.__wf = true; dispatchEvent(new Event('wfchange')); } }, true);   // clicking the page means you're here
  document.addEventListener('visibilitychange', () => dispatchEvent(new Event('wfchange'))); })();
  const SONGS = [1, 2, 3].map(n => `media/audio_bgm_emp_${n}.mp3`);
  const g = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch (e) { return d; } };
  const target = () => { if (g('painWheelMusicOff', false) === true || document.hidden || !window.__wf) return 0; const mv = g('painWheelMusicVol', .5), v = parseFloat(localStorage.getItem('painWheelVolume')); return .5 * (typeof mv === 'number' ? mv : .5) * (isNaN(v) ? .6 : Math.max(0, Math.min(1, v))); };
  const ramp = (a, to, ms, done) => { const f = a.volume, t0 = performance.now(); (function st() { const k = Math.min(1, (performance.now() - t0) / ms); a.volume = Math.max(0, Math.min(1, f + (to - f) * k)); if (k < 1) requestAnimationFrame(st); else if (done) done(); })(); };
  let cur = null, last = -1;
  function next() {
    let i; do { i = Math.floor(Math.random() * SONGS.length); } while (SONGS.length > 1 && i === last); last = i;
    const a = new Audio(SONGS[i]); a.volume = 0; const old = cur; cur = a; if (old) ramp(old, 0, 3000, () => old.pause());
    if (target() > 0) a.play().then(() => ramp(a, target(), 2500)).catch(() => {});
    a.addEventListener('timeupdate', function nx() { if (a.duration && a.currentTime > a.duration - 4 && cur === a) { a.removeEventListener('timeupdate', nx); next(); } });
    a.addEventListener('ended', () => { if (cur === a) next(); });
  }
  const apply = () => { if (!cur) return; const t = target(); if (t > 0) { cur.play().catch(() => {}); ramp(cur, t, 900); } else ramp(cur, 0, 600, () => { if (!target()) cur.pause(); }); };
  addEventListener('pointerdown', () => { if (!cur) next(); }, { once: true });
  document.addEventListener('visibilitychange', apply); addEventListener('wfchange', apply);
})();
</script>
<script>
// the cobra basket: every great once in a while the lid lifts and a cobra says hi
(() => {
  const b = document.getElementById('cobra'); if (!b) return; const img = b.querySelector('img'); let busy = false, n = 0;
  const LINES = ["Don't open the basket. That's Steve's brother. Also Steve.", "That's not for sale. That's security.", "The basket came with the stall. The cobra came with the basket. No refunds on either.", 'He bites. Mostly Kevin.'];
  function rise(talk) {
    if (busy) return; busy = true; img.src = 'media/cobra_anim.webp?n=' + (++n);   // a fresh copy so it plays from the start
    if (talk && typeof say === 'function') setTimeout(() => say(LINES[Math.floor(Math.random() * LINES.length)], 4200), 900);
    setTimeout(() => { img.src = 'media/cobra_still.png'; busy = false; }, 2500);
  }
  b.onclick = () => rise(true);
  setInterval(() => { if (!document.hidden && Math.random() < .12) rise(false); }, 60000);   // about once every 8 minutes, on its own
  window.cobra = rise;
})();
</script>
