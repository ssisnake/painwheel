const CLAW_PRIZES = [
  { k: 'volley', img: 'media/photo_volley.png', won: '🏐 YOU WON VOLLEY McBALLFACE. He is yours now. He does not explain the handprint.' },
  { k: 'spinny', img: 'media/photo_pet_spinny.png', won: "🎡 YOU WON LIL' SPINNY. It has not stopped spinning since you picked it up." },
  { k: 'gerald', img: 'media/photo_pet_gerald.png', won: '🐹 YOU WON GERALD. He says he powers The Wheel. He wants a raise.' },

  { k: 'slimothy', img: 'media/photo_pet_slime.png', won: '🟢 YOU WON SLIMOTHY. The sunglasses stayed on the whole time.' },
  { k: 'piggy', img: 'media/photo_pet_piggy.png', won: '🐷 YOU WON THE GOBLIN PIGGY BANK. It already wants your gold.' }];
const fmt = (n) => { n = Math.round(n); if (n < 1e15) return n.toLocaleString() + 'g'; const e = Math.floor(Math.log10(n)); return (n / Math.pow(10, e)).toFixed(2) + 'e' + e + 'g'; };
const queueAch = (id) => { const q = get('painWheelPendingAch', []); if (!q.includes(id)) q.push(id); put('painWheelPendingAch', q); };
// sound: the real claw motor / token / crash files, at the wheel's volume
let AC = null; const BUF = {};
const vol = () => { const v = parseFloat(localStorage.getItem('painWheelVolume')); return isNaN(v) ? 0.6 : Math.max(0, Math.min(1, v)); };
// the claw cabinet's dying speaker: thin, crunchy, a little hissy (same feel as its music). The neon sign skips it.
let BUSTED = null;
const busted = () => {
  if (BUSTED) return BUSTED;
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 450;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
  const sh = AC.createWaveShaper(), N = 1024, c = new Float32Array(N); for (let i = 0; i < N; i++) { const x = i / (N - 1) * 2 - 1; c[i] = Math.round(Math.tanh(x * 2.2) / Math.tanh(2.2) * 24) / 24; } sh.curve = c;

const sfx = (name, dur, rate) => {
  try {
    if (!vol()) return () => {};

      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.8 * vol(), t + .05); if (dur) { g.gain.setValueAtTime(0.8 * vol(), t + Math.max(.08, dur - .12)); g.gain.linearRampToValueAtTime(0.0001, t + dur); s.stop(t + dur + .05); }

  } catch (e) {}
};
// ---- arcade music while you're at the claw machine (Pixabay: atlasaudio, mfcc), crossfading; the wind ducks under it ----
(() => { if (window.__wfSet) return; window.__wfSet = true; window.__wf = window.__wf;   // our own record of whether this window has focus (more reliable than asking during the blur event)

const CLAW_BGM = [1, 2, 3, 4, 5].map(n => `media/audio_bgm_clawbusted${n}.mp3`);   // same songs through the cabinet's dying speaker (WHEEL-2600 keeps the clean ones)

// desert wind through the broken boards: the recorded gust, looped twice at different speeds so it never sounds like a loop, very quiet, starts on your first click
function startWind() {
  try {
    if (!vol()) return; AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (startWind.on) return; startWind.on = true;
