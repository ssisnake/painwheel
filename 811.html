<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #0b1410; color: #fde68a; font-family: system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; }
  h1 { margin: 0; font-size: clamp(24px, 3.4vw, 36px); letter-spacing: .03em; color: #fb923c; text-shadow: 0 2px 0 #14532d, 0 0 14px rgba(251,146,60,.4); }

  .scene { position: relative; width: min(2576px, 100%, calc((100vh - 178px) * 2576 / 1438)); aspect-ratio: 2576 / 1438; background: url(media/store811_bg.jpg) 0 0 / 100% 100% no-repeat; border-radius: 10px; box-shadow: 0 0 0 3px #f97316, 0 20px 60px rgba(0,0,0,.7); overflow: hidden; }
  @media (max-width: 700px) { .scene { min-width: 640px; } .scroller { place-items: start; } }
  .prop { position: absolute; display: block; padding: 0; border: 0; background: none; cursor: pointer; transition: transform .15s, filter .15s; }
  .prop img { display: block; width: 100%; height: auto; image-rendering: pixelated; pointer-events: none; }
  .prop:hover, .prop:focus-visible { transform: scale(1.07); filter: drop-shadow(0 0 10px #fde68a); outline: none; z-index: 4; }
  .deco { position: absolute; pointer-events: none; image-rendering: pixelated; }
  .hs { position: absolute; padding: 0; border: 3px solid transparent; border-radius: 10px; background: transparent; cursor: pointer; }
  .hs:hover, .hs:focus-visible { border-color: #fde68a; box-shadow: 0 0 14px #fde68a; outline: none; }
  .hs.secret, .hs.secret:hover, .hs.secret:focus-visible { border-color: transparent; box-shadow: none; cursor: default; }
  .tap { position: absolute; padding: 0; border: 3px solid transparent; border-radius: 12px; background: transparent; cursor: pointer; }
  .tap:hover, .tap:focus-visible { border-color: #fde68a; box-shadow: 0 0 18px #fde68a; outline: none; }
  #cup { position: absolute; display: none; translate: -50% 0; image-rendering: pixelated; pointer-events: none; z-index: 5; transition: opacity 1.2s; }
  @keyframes wob { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
  /* the dying fluorescent tube (right ceiling light) */
  .bulb { position: absolute; left: 67.6%; top: 3.6%; width: 19.6%; height: 3.8%; pointer-events: none; background: rgba(30,30,28,.82); mix-blend-mode: multiply; opacity: 0; animation: bulb 6.5s infinite; }
  @keyframes bulb { 0%, 41%, 47%, 49%, 77%, 100% { opacity: 0; } 42%, 46%, 48%, 78%, 79.5% { opacity: 1; } }
  .bulbglow { position: absolute; left: 66%; top: 6%; width: 23%; height: 22%; pointer-events: none; background: radial-gradient(ellipse at 50% 0%, rgba(255,255,220,.22), transparent 70%); animation: glow 6.5s infinite; }
  @keyframes glow { 0%, 41%, 47%, 49%, 77%, 100% { opacity: 1; } 42%, 46%, 48%, 78%, 79.5% { opacity: 0; } }
  #hatch { position: absolute; left: 3.2%; top: 57.5%; width: 4.4%; height: 10.5%; display: none; padding: 0; border: 2px solid #78716c; border-radius: 4px; cursor: pointer; z-index: 6;
    background: radial-gradient(circle at 50% 55%, rgba(250,204,21,.55), #0c0a09 70%); box-shadow: inset 0 0 12px #000, 0 0 16px rgba(250,204,21,.5); font-size: clamp(14px, 2vw, 28px); animation: hatchIn .6s ease-out; }
  @keyframes hatchIn { from { transform: scaleY(0); transform-origin: top; } to { transform: none; } }
  #customer { position: absolute; bottom: 4%; z-index: 3; animation: idle 2.6s ease-in-out infinite; }
  @keyframes idle { 50% { translate: 0 -3%; } }
  #say { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); max-width: 80%; padding: 10px 18px; border-radius: 10px; background: rgba(12,10,9,.92); border: 2px solid #f97316; color: #fef3c7; font: 800 19px/1.35 system-ui, sans-serif; text-align: center; display: none; z-index: 9; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; padding: 10px 12px 18px; font-size: 18px; color: #d6d3d1; }
  .bar { gap: 12px 18px; }
  .barlbl { font-size: 18px; color: #d6d3d1; display: inline-flex; align-items: center; gap: 10px; } .mach { height: 56px; image-rendering: pixelated; filter: drop-shadow(0 3px 0 rgba(0,0,0,.5)); } .barlbl b { color: #fb923c; }
  .flav { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding: 6px; border-radius: 14px; background: linear-gradient(#1f2937, #111827); box-shadow: inset 0 0 0 2px #374151, 0 6px 16px rgba(0,0,0,.5); }
  .fl { display: inline-flex; align-items: center; gap: 8px; font: 900 18px system-ui, sans-serif; padding: 6px 16px 6px 8px; border: 2px solid rgba(255,255,255,.25); border-radius: 10px; cursor: pointer; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.45);
    background: linear-gradient(180deg, var(--c2), var(--c1) 70%); box-shadow: inset 0 -3px 0 rgba(0,0,0,.3), 0 3px 0 rgba(0,0,0,.45); transition: transform .12s, filter .12s; }
  .fl img { height: 38px; width: auto; image-rendering: pixelated; filter: drop-shadow(0 2px 0 rgba(0,0,0,.5)); }
  .fl:hover, .fl:focus-visible { transform: translateY(-2px); filter: brightness(1.12); outline: none; } .fl:active { transform: translateY(1px); }
  #closed { position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; background: rgba(5,10,8,.88); }
  #closed b { font-size: clamp(28px, 4vw, 48px); color: #f87171; letter-spacing: .06em; }
  #closed p { margin: 0; font-size: 20px; color: #e7e5e4; max-width: 560px; line-height: 1.4; }
  #closed a { font: 800 18px system-ui, sans-serif; padding: 9px 18px; border-radius: 10px; background: #f59e0b; color: #1c1917; text-decoration: none; }
  #shopFrame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 60; background: transparent; opacity: 0; transition: opacity .2s; }
  #shopWait { position: fixed; inset: 0; z-index: 59; display: flex; align-items: center; justify-content: center; background: rgba(2,6,23,.55); color: #fde68a; font: 800 22px system-ui, sans-serif; text-shadow: 0 2px 0 #000; }
</style></head><body>
<header><h1>🏪 The 8/11</h1><span id="goldBox"></span><nav><a class="alt" href="./"><img src="media/board_icon.png" alt="" style="height:1.15em;width:auto;vertical-align:-.25em;margin-right:.25em;border-radius:2px">The Board</a><a class="alt" href="#" id="catalogBtn">🛒 The whole catalog</a><a href="wheel.html">🎡 Back to The Wheel</a></nav></header>
<div class="wrap"><div class="scroller"><div class="scene" id="scene">
  <div class="bulbglow"></div><div class="bulb"></div>
  <button class="tap" data-f="Blue Raspberry" style="left:3%;top:33%;width:10.5%;height:27%" title="Blue Raspberry Slurpee (1 gold)" aria-label="Blue Raspberry Slurpee, 1 gold"></button>
  <button class="tap" data-f="Cherry" style="left:13.5%;top:33%;width:5.3%;height:27%" title="Cherry Slurpee (1 gold)" aria-label="Cherry Slurpee, 1 gold"></button>
  <button class="tap" data-f="Lime" style="left:18.8%;top:33%;width:4.4%;height:27%" title="Lime Slurpee (1 gold)" aria-label="Lime Slurpee, 1 gold"></button>
  <img id="cup" alt="">
  <button id="hatch" type="button" aria-label="A secret compartment">🔑</button>
  <div id="props"></div>
  <div id="say" role="status"></div>
  <div id="closed"><b>CLOSED</b><p>The 8/11 is closed. It is open 11 days a week, just not for you yet.<br>Land on <b style="font-size:inherit;color:#fb923c">8/11</b> on the wheel to open it. The shop lives in here.</p><a href="wheel.html">🎡 Go spin</a></div>
</div></div></div>
<div class="bar"><span class="barlbl"><img class="mach" src="media/s811_slurpee_machine.png" alt=""><b>Slurpee machine</b> · 1 gold a cup · or click an aisle sign to shop</span>
  <div class="flav"><button data-f="Blue Raspberry" class="fl" style="--c1:#1d4ed8;--c2:#38bdf8"><img src="media/s811_cup_blue.png" alt="">Blue Raspberry</button><button data-f="Cherry" class="fl" style="--c1:#b91c1c;--c2:#fb7185"><img src="media/s811_cup_cherry.png" alt="">Cherry</button><button data-f="Lime" class="fl" style="--c1:#15803d;--c2:#86efac"><img src="media/s811_cup_lime.png" alt="">Lime</button></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const get = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const fmt = (n) => { n = Math.round(n); if (n < 1e15) return n.toLocaleString() + 'g'; const e = Math.floor(Math.log10(n)); return (n / Math.pow(10, e)).toFixed(2) + 'e' + e + 'g'; };
const say = (t, ms) => { const d = $('say'); d.textContent = t; d.style.display = 'block'; clearTimeout(say.t); say.t = setTimeout(() => d.style.display = 'none', ms || 3400); };
const has811 = () => get('painWheel811Open', false) || ((get('painWheelStats', {}) || {}).byType || {}).SEVEN_ELEVEN > 0;
const showGold = () => { $('goldBox').textContent = '🪙 ' + fmt(get('painWheelGold', 0)); };
showGold(); addEventListener('storage', (e) => { if (e.key === 'painWheelGold') showGold(); });

// sound: the wheel's own clips, at the wheel's volume (browsers wait for your first click)
let AC = null; const BUF = {};
const vol = () => { const v = parseFloat(localStorage.getItem('painWheelVolume')); return isNaN(v) ? 0.6 : Math.max(0, Math.min(1, v)); };
const sfx = (name) => {
  try {
    if (!vol()) return;
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const go = (b) => { const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = b; g.gain.value = 0.8 * vol(); s.connect(g); g.connect(AC.destination); s.start(); };
    if (BUF[name]) return go(BUF[name]);
    fetch('media/' + name + '.mp3').then(r => r.arrayBuffer()).then(ab => AC.decodeAudioData(ab)).then(b => { BUF[name] = b; go(b); }).catch(() => {});
  } catch (e) {}
};

if (!has811()) $('closed').style.display = 'flex';
else {
  put('painWheelSeen811', true);
  sfx('audio_door_chime'); addEventListener('pointerdown', () => { if (AC && AC.state === 'suspended') { AC.resume(); } }, { once: true });
}

// the dying fluorescent tube buzzes when it flickers (the CSS flicker runs on a 6.5s loop; it cuts out at 42% and 78%)
const sfxQuiet = (name, g) => { try { if (!vol() || !AC || AC.state !== 'running') return; const go = (b) => { const s = AC.createBufferSource(), gn = AC.createGain(); s.buffer = b; gn.gain.value = g * vol(); s.connect(gn); gn.connect(AC.destination); s.start(); };
  if (BUF[name]) return go(BUF[name]); fetch('media/' + name + '.mp3').then(r => r.arrayBuffer()).then(ab => AC.decodeAudioData(ab)).then(b => { BUF[name] = b; go(b); }).catch(() => {}); } catch (e) {} };
setTimeout(function buzz() { if (!document.hidden) sfxQuiet('audio_flicker', .35); setTimeout(buzz, 6500); }, .41 * 6500);
addEventListener('pointerdown', () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }, { once: true });
// ---- the store: aisle signs open that shop tab on the wheel, the clerk points, the rest is jokes ----
const AISLES = [
  ['PETS', 'photo_811_sign_pets', 43, 26.6, 7.4, 'pets', 'Pets. They bite. The claw machine is in the desert shack.'],
  ['TOYS', 'photo_811_sign_toys', 51.8, 26.6, 7, 'garage', 'Toys. And cars. And a rocket. Do not ask where we keep the rocket.'],
  ['SNACKS & POTIONS', 'photo_811_sign_snacks', 60.6, 25.4, 7.4, 'consumables', 'Snacks and potions. Same shelf. Same expiration date.'],
  ['COSMETICS', 'photo_811_sign_cosmetics', 69.3, 26.6, 8.6, 'cosmetics', 'Cosmetics. Make the needle pretty. Switch them in Settings.'],
  ['THEMES', 'photo_811_sign_themes', 33.4, 21.5, 8, 'themes', 'Themes. New paint for the whole wheel. Switch them in Settings.'],
  ['CURSES', 'photo_811_sign_curses', 88.4, 25, 7.8, 'curses', 'Curses. Aim them at a guildmate. We are not liable.'] ];
const PROPS = [['photo_811_hotdog', 24.6, 51.6, 9.2, 'hotdog', 'Hot dog roller'], ['photo_811_lottery', 34, 47.8, 7.6, 'scratch', 'Scratch-offs'],
  ['photo_811_carrier1', 44.5, 74, 6.2, 'pets', 'Pets'], ['photo_811_carrier2', 51.4, 75, 5.8, 'pets', 'Pets']];
const JOKES = {
  hotdog: ['That hot dog has been rolling since 2019. It is not for sale. It is load-bearing.', 'The hot dogs are free. Nobody has ever taken one. Ever.', "Kevin ate one in 2021. He doesn't talk about it."],
  atm: ['OUT OF ORDER. Has been since the Cataclysm.', 'The ATM charges a 1% fee to tell you it is out of order.', 'Try the Guild Bank Vault on the yacht. This thing eats cards.'],
  open: ['Open 7 hours a day, 11 days a week. Do the math. We did not.', 'Closed on days that end in Y.'],
  cam: ['The camera blinks at you. It has seen things.', 'Smile. You are on Goblin Security TV.', 'The red light is on. Nobody is watching. Probably.'] };
const props = $('props');
const add = (html) => { props.insertAdjacentHTML('beforeend', html); return props.lastElementChild; };
const clerk = add('<img class="deco" src="media/photo_811_clerk.png" alt="" style="right:5.4%;bottom:37.6%;width:10.4%;z-index:1">');
function point(ms) { clerk.src = 'media/photo_811_clerk_point.png'; clerk.style.width = '11.4%'; clearTimeout(point.t); point.t = setTimeout(() => { clerk.src = 'media/photo_811_clerk.png'; clerk.style.width = '10.4%'; }, ms || 1400); }
// the shop opens right here in the store: the wheel page loads in a frame showing only the shop, and goes away when you close it
function goShop(tab) {
  point(1000); if ($('shopFrame')) return;
  const w = document.createElement('div'); w.id = 'shopWait'; w.textContent = 'The clerk is getting the price gun...'; document.body.appendChild(w);
  const f = document.createElement('iframe'); f.id = 'shopFrame'; f.title = 'The 8/11 shop';
  f.src = 'wheel.html?embed=shop' + (tab ? '#go=shop_' + tab : ''); document.body.appendChild(f);
  setTimeout(() => { if ($('shopWait')) closeShopFrame(); }, 20000);   // never got ready: don't leave a dead overlay up
}
function closeShopFrame() { const f = $('shopFrame'), w = $('shopWait'); if (f) f.remove(); if (w) w.remove(); showGold(); }
addEventListener('message', (e) => {
  if (e.origin !== location.origin || !e.data || !e.data.shop) return;
  if (e.data.shop === 'ready') { const f = $('shopFrame'), w = $('shopWait'); if (f) { f.style.opacity = '1'; try { f.focus(); } catch (err) {} } if (w) w.remove(); }
  else if (e.data.shop === 'close') closeShopFrame();
  else if (e.data.shop === 'go' && /^wheel\.html#go=\w+$/.test(e.data.href || '')) location.href = e.data.href;
});
$('catalogBtn').onclick = (e) => { e.preventDefault(); goShop(''); };
AISLES.forEach(([name, img, l, t, w, tab, line]) => {
  const b = add(`<button type="button" class="prop" title="${name}" aria-label="Shop: ${name}" style="left:${l}%;top:${t}%;width:${w}%"><img src="media/${img}.png" alt=""></button>`);
  b.onmouseenter = b.onfocus = () => point(1800);
  b.onclick = () => { say(line, 2600); goShop(tab); };
});
add('<img class="deco" src="media/photo_811_sale.png" alt="" style="left:93.4%;top:22.4%;width:4%;transform:rotate(14deg);z-index:2">');
PROPS.forEach(([img, l, t, w, act, name]) => {
  const b = add(`<button type="button" class="prop" title="${name}" aria-label="${name}" style="left:${l}%;top:${t}%;width:${w}%"><img src="media/${img}.png" alt=""></button>`);
  b.onclick = () => JOKES[act] ? say(pick(JOKES[act]), 3400) : goShop(act);
});
add('<img class="deco" src="media/photo_811_pricetag.png" alt="" style="left:30.2%;top:57.6%;width:3%;transform:rotate(-8deg)">');
[['atm', 'The ATM', 34.4, 42.5, 6, 18, ''], ['open', 'The sign', 80.2, 29.5, 5.6, 11, ''], ['door', 'Leave', 24.4, 21, 6.4, 28, ''], ['cam', '', 82.6, 12.4, 6, 8, ' secret']].forEach(([k, name, l, t, w, h, cls]) => {
  const b = add(`<button type="button" class="hs${cls}" ${name ? `title="${name}" aria-label="${name}"` : 'tabindex="-1" aria-hidden="true"'} style="left:${l}%;top:${t}%;width:${w}%;height:${h}%"></button>`);
  b.onclick = () => {
    if (k === 'door') { location.href = 'wheel.html'; return; }
    if (k === 'cam' && get('painWheelSeenVip', false)) { say('📹 The camera feed flickers... is that the VIP room?', 1800); setTimeout(() => { location.href = 'yacht.html#vip'; }, 1300); return; }
    say(pick(JOKES[k]), 3400);
  };
});

// ---- a random regular wanders in every visit ----
const REGULARS = [
  ['photo_clippy', 5, ["It looks like you're buying a Slurpee. Would you like help with that?", 'I come here for the fluorescent lights. They remind me of 1997.', 'I asked the clerk for a job. He said they already have a paperclip. It is holding the receipts.',
    "Do not tell anyone, but I have never tried a Slurpee. I don't have a mouth. I have opinions.", 'It looks like you are leaving. Would you like help staying?']],
  ['photo_volley', 4.5, ['...', '... (Volley stares at the hot dog roller.)', '... (Volley is a volleyball. Volley does not talk. Volley is judging you.)', '... (There is a handprint on Volley. Nobody asks.)']],
  ['photo_whelp', 7, ['*the whelp is licking the Slurpee machine*', '*tiny smoke puff* (it wants the hot dogs)', '*the whelp tries to breathe fire on the ice machine. Steam everywhere.*', '*it curls up on the warm hot dog roller and refuses to move*']],
  ['photo_chicken', 5, ['Bawk.', 'Bawk bawk. (The chicken is here for the hot dogs. Do not ask what is in them.)', 'BAWK! (It saw the egg salad sandwiches.)', 'Bawk. (It has a quest for you. The quest is "leave".)']],
  ['photo_pet_spinny', 5, ["wheeeee I can't stop spinning in the aisle", 'do they sell anything that makes you stop spinning', 'i got dizzy in the candy aisle. it was the best day of my life', 'the clerk said no running in the store. i am not running. i am rolling']],
  ['photo_pet_gerald', 5.5, ['Reading the magazines. Not buying any. Classic me.', 'I power The Wheel, you know. Twelve-hour shifts. I am here for the coffee.', 'They will not let me pay in sunflower seeds. Unions have fallen for less.', 'Do not tell The Wheel I took a break.']],
  ['photo_pet_kevjr', 5.5, ['I want a lottery ticket! I have a Monopoly dollar!', "Dad says don't stand in fire. I don't know what that means. Dad doesn't either.", 'Can I have a hot dog? Can I have two? Can I have the roller?', 'I pulled the fire alarm. Like dad pulls bosses.']],
  ['photo_pet_needle', 4, ['*The Needle points at the CURSES aisle.*', '*The Needle points at you. Then at the Slurpee machine. Then back at you.*', '*The Needle points at the security camera. Huh.*', '*The Needle spins once and points at the door. Rude.*']],
  ['photo_pet_duck', 5, ['Quack. (Raid Duck is buying a raid helmet. Another one.)', 'Quack quack. (It wants to know if the Slurpee counts as a flask.)', '*squeak* (it stood in the spill)']],
  ['photo_pet_slime', 5.5, ['sup.', 'i am here for the Slurpees. we are related.', 'the lights are too bright. the glasses stay on.', '*slorp* (it ate a hot dog. whole.)']],
  ['photo_pet_piggy', 6, ['Time is money, friend. Buy something.', 'I am not shoplifting. I am collecting.', 'The ATM is broken. I may have had something to do with that.']],
  ['photo_pet_skeleton', 5, ['One token. I have one token left. I am NOT spending it here.', 'My brother is in the desert shack. Say hi. Do not play the claw.', '*rattles at the lottery tickets*']],
  ['photo_uwu_icon', 6, ['Forty energy drinks. Raid tonight.', 'Do not tell the guild you saw me here. I have a reputation.', 'The clerk gave me the boss discount. It is 0%.', 'I could wipe this whole store. I am choosing not to. Today.']]];
const [rImg, rW, rLines] = pick(REGULARS), rx = 60 + Math.random() * 10; let rN = 0;
const reg = add(`<button type="button" class="prop" id="customer" title="A regular" aria-label="A regular" style="left:${rx}%;width:${rW}%"><img src="media/${rImg}.png" alt=""></button>`);
reg.onclick = () => say(rLines[rN++ % rLines.length], 4200);
setTimeout(() => { if (has811()) { say(rLines[rN++ % rLines.length], 3800); metNpc('clerk'); metNpc(rImg); } }, 2600);   // they say hi when you walk in (and now they have your number)
function metNpc(k) { try { const m = JSON.parse(localStorage.getItem('painWheelMetNpcs') || '{}') || {}; if (!m[k]) { m[k] = Date.now(); localStorage.setItem('painWheelMetNpcs', JSON.stringify(m)); } } catch (e) {} }

// ---- Slurpees: 1 gold, poured from the real machine. The cup gets cleared once you're done ----
const HUE = { 'Cherry': '', 'Blue Raspberry': 'hue-rotate(215deg) saturate(1.3)', 'Lime': 'hue-rotate(110deg) saturate(1.2)' };
const LINES = { 'Cherry': ['Cherry. A classic. Like Kevin pulling.', 'Red. Like the raid frames.'], 'Blue Raspberry': ["Blue raspberry. Raspberries aren't blue. Don't think about it.", 'Your tongue is blue for three raid nights.'],
  'Lime': ['Lime. Bold choice. Wrong, but bold.', 'Green, like the pull timer Kevin ignored.'] };
const SPILL = ['Clean up on aisle 8. Your gold is gone. So is your Slurpee.', 'Dropped it. The 8/11 has a no-refund policy. And no floor mop.', 'Kevin bumped you. Kevin says he did not bump you.', 'It hit the floor before the lid did. Gravity: 1, you: 0.'];
const TAPS = { 'Blue Raspberry': 11.6, 'Cherry': 16.4, 'Lime': 21 };
let busy = false, seq = [];
const clues = () => get('painWheelClues', {}) || {};
function checkRGB(f) {   // hidden evidence: pour red, then green, then blue and the machine opens a secret compartment
  seq.push(f); seq = seq.slice(-3);
  if (seq.join('|') !== 'Cherry|Lime|Blue Raspberry') return;
  seq = []; setTimeout(() => { $('hatch').style.display = 'grid'; $('hatch').style.placeItems = 'center'; say('*CLUNK* A little panel just popped open on the side of the Slurpee machine.', 4000); point(2500); }, 2600);
}
$('hatch').onclick = () => {
  const cl = clues(), first = !cl.rgb; cl.rgb = true; put('painWheelClues', cl);
  say('Inside the secret compartment: a tiny key, and a sticker of an old TV with a little wheel on the screen.' + (first ? ' 📌 Evidence found! It is pinned to The Board.' : ' You already took this one.'), 6500);
  $('hatch').style.display = 'none';
